<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Justificación de Labor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            /* Paleta Corporativa */
            --teal-corp: #005C53;
            --dark-corp: #121A19;
            --orange-corp: #F57C00;
        }

        html {
            height: 100%;
            background-color: var(--dark-corp);
        }

        body {
            background-color: var(--dark-corp);
            color: #F8F9FA;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 15px;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto; 
        }

        .compact-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
        }

        .form-control {
            background-color: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: white !important;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .form-control:focus {
            border-color: var(--orange-corp) !important;
            box-shadow: 0 0 0 3px rgba(245, 124, 0, 0.2) !important;
        }

        .form-control[readonly] {
            background-color: rgba(255, 255, 255, 0.02) !important;
            color: #ADB5BD !important;
            cursor: not-allowed;
        }

        .form-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ADB5BD;
            margin-bottom: 4px;
        }

        .btn-submit {
            background-color: var(--teal-corp);
            color: white;
            border: none;
            padding: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 6px;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #007A6E;
        }

        .btn-submit:disabled {
            background-color: #2b3a38;
            color: #ADB5BD;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="compact-card">
        <h5 class="mb-3" style="color: var(--orange-corp); font-weight: bold;">Auditoría de Labor</h5>
        
        <div id="justificacionForm">
            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label">ID Técnico</label>
                    <input type="text" id="tecnico" class="form-control" readonly required>
                </div>
                <div class="col-6">
                    <label class="form-label">Fecha</label>
                    <input type="text" id="fecha" class="form-control" readonly required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Justificación de Tiempos</label>
                <textarea id="comentario" class="form-control" rows="4" placeholder="Detalle el motivo de la desviación de horas..." required></textarea>
            </div>

            <button type="button" class="btn-submit" id="btnGuardar">
                <span class="spinner-border spinner-border-sm d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                <span id="btnText">Guardar Justificación</span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. LEER PARÁMETROS DE URL
            const parametrosURL = new URLSearchParams(window.location.search);
            const paramTecnico = parametrosURL.get('tecnico');
            const paramFecha = parametrosURL.get('fecha');

            if (paramTecnico) document.getElementById('tecnico').value = paramTecnico;
            if (paramFecha) document.getElementById('fecha').value = paramFecha;

            // 2. LÓGICA DE ENVÍO AL HACER CLIC EN EL BOTÓN
            document.getElementById('btnGuardar').addEventListener('click', async () => {
                
                const comentarioInput = document.getElementById('comentario');
                
                // Validación manual al no haber etiqueta <form>
                if(comentarioInput.value.trim() === "") {
                    Swal.fire({
                        title: "Campo Requerido",
                        text: "Por favor, detalle el motivo de la desviación de horas.",
                        icon: "warning",
                        background: "var(--dark-corp)",
                        color: "#F8F9FA",
                        confirmButtonColor: "var(--orange-corp)"
                    });
                    return; // Detiene la ejecución
                }

                const btn = document.getElementById('btnGuardar');
                const spinner = document.getElementById('btnSpinner');
                const btnText = document.getElementById('btnText');
                
                const id_tecnico = document.getElementById('tecnico').value;
                const fecha = document.getElementById('fecha').value;
                
                // Limpieza de guiones para el cruce con Power Query (ej. de 2026-05-27 a 20260527)
                const llave_jornada = `${id_tecnico}-${fecha.replace(/-/g, '')}`; 

                const payload = {
                    llave_jornada: llave_jornada,
                    tecnico: id_tecnico,
                    fecha: fecha,
                    comentario: comentarioInput.value
                };

                // --- ESTADO VISUAL: GUARDANDO ---
                btn.disabled = true;
                spinner.classList.remove('d-none');
                btnText.innerText = "Registrando...";

                try {
                    // AQUÍ VA TU URL REAL DE POWER AUTOMATE
                    const urlAutomate = "https://defaultc9a8e948bf0d4f8d9e9d551ac1b45a.48.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9bd6afe1c8a6458fb8951535152cc54a/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=7om6UfdxQcNtralinqhj9vWLVgM36hT2CNhUe9XKoNk";
                    
                    const response = await fetch(urlAutomate, {
                        method: 'POST',
                        // Si sigues teniendo problemas de CORS en Power BI Web, cambia 'application/json' por 'text/plain'
                        headers: { 'Content-Type': 'application/json' }, 
                        body: JSON.stringify(payload)
                    });

                    if(response.ok) {
                        // --- ESTADO VISUAL: ÉXITO ---
                        Swal.fire({
                            title: "¡Guardado!",
                            text: "La auditoría ha sido documentada en el sistema.",
                            icon: "success",
                            background: "var(--dark-corp)",
                            color: "#F8F9FA",
                            confirmButtonColor: "var(--teal-corp)",
                            timer: 3000,
                            timerProgressBar: true
                        }).then(() => {
                            comentarioInput.value = ""; // Limpia el campo
                        });
                    } else {
                        throw new Error("Fallo en el servidor");
                    }
                } catch (error) {
                    // --- ESTADO VISUAL: ERROR ---
                    Swal.fire({
                        title: "Error de Conexión",
                        text: "No se logró enviar la información. Verifica la red e intenta nuevamente.",
                        icon: "error",
                        background: "var(--dark-corp)",
                        color: "#F8F9FA",
                        confirmButtonColor: "var(--orange-corp)"
                    });
                } finally {
                    // --- RESTAURAR BOTÓN ---
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                    btnText.innerText = "Guardar Justificación";
                }
            });
        });
    </script>
</body>
</html>
