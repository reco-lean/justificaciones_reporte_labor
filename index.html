<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Justificación de Labor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --teal-corp: #005C53;
            --dark-corp: #121A19;
            --orange-corp: #F57C00;
        }

        html {
            height: 100%;
            background-color: var(--dark-corp);
        }

        body {
            background-color: var(--dark-corp);
            color: #F8F9FA;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 15px;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto; 
        }

        .compact-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
        }

        .form-control, .form-select {
            background-color: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            color: white !important;
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--orange-corp) !important;
            box-shadow: 0 0 0 3px rgba(245, 124, 0, 0.2) !important;
        }

        .form-control[readonly] {
            background-color: rgba(255, 255, 255, 0.02) !important;
            color: #ADB5BD !important;
            cursor: not-allowed;
        }

        /* Ajuste para las opciones del select en modo oscuro */
        option {
            background-color: var(--dark-corp);
            color: white;
        }

        .form-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ADB5BD;
            margin-bottom: 4px;
        }

        .btn-submit {
            background-color: var(--teal-corp);
            color: white;
            border: none;
            padding: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 6px;
            width: 100%;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }

        .btn-submit:hover:not(:disabled) {
            background-color: #007A6E;
        }

        .btn-submit:disabled {
            background-color: #2b3a38;
            color: #ADB5BD;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="compact-card">
        <h5 class="mb-3" style="color: var(--orange-corp); font-weight: bold;">Auditoría de Labor</h5>
        
        <div id="justificacionForm">
            <div class="row mb-3">
                <div class="col-6">
                    <label class="form-label">ID Técnico</label>
                    <input type="text" id="tecnico" class="form-control" readonly required>
                </div>
                <div class="col-6">
                    <label class="form-label">Fecha</label>
                    <input type="text" id="fecha" class="form-control" readonly required>
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-8">
                    <label class="form-label">Motivo Principal</label>
                    <select id="motivo" class="form-select" required>
                        <option value="" disabled selected>Seleccione una categoría...</option>
                        <option value="Entrenamiento">Entrenamiento</option>
                        <option value="Asignación a labor fuera de QPSuite">Asignación a labor fuera de QPSuite</option>
                        <option value="Labor de mantenimiento">Labor de mantenimiento</option>
                        <option value="Libranza">Libranza</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
                <div class="col-4">
                    <label class="form-label">Horas</label>
                    <input type="number" id="tiempo" class="form-control" step="0.1" min="0" placeholder="Ej: 2.5" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Detalle (Comentario)</label>
                <textarea id="comentario" class="form-control" rows="3" placeholder="Detalle la justificación operativa..." required></textarea>
            </div>

            <button type="button" class="btn-submit" id="btnGuardar">
                <span class="spinner-border spinner-border-sm d-none" id="btnSpinner" role="status" aria-hidden="true"></span>
                <span id="btnText">Guardar Justificación</span>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const parametrosURL = new URLSearchParams(window.location.search);
            const paramTecnico = parametrosURL.get('tecnico');
            const paramFecha = parametrosURL.get('fecha');
            const paramHoras = parametrosURL.get('horas'); // Ahora puede atrapar las horas desde Power BI

            if (paramTecnico) document.getElementById('tecnico').value = paramTecnico;
            if (paramFecha) document.getElementById('fecha').value = paramFecha;
            if (paramHoras) document.getElementById('tiempo').value = paramHoras; // Autocompleta si viene en la URL

            document.getElementById('btnGuardar').addEventListener('click', async () => {
                
                const motivoInput = document.getElementById('motivo');
                const tiempoInput = document.getElementById('tiempo');
                const comentarioInput = document.getElementById('comentario');
                
                if(motivoInput.value === "" || tiempoInput.value === "" || comentarioInput.value.trim() === "") {
                    Swal.fire({
                        title: "Campos Incompletos",
                        text: "Asegúrese de seleccionar un motivo, asignar el tiempo y escribir un comentario.",
                        icon: "warning",
                        background: "var(--dark-corp)",
                        color: "#F8F9FA",
                        confirmButtonColor: "var(--orange-corp)"
                    });
                    return; 
                }

                const btn = document.getElementById('btnGuardar');
                const spinner = document.getElementById('btnSpinner');
                const btnText = document.getElementById('btnText');
                
                const id_tecnico = document.getElementById('tecnico').value;
                const fecha = document.getElementById('fecha').value;
                
                const llave_jornada = `${id_tecnico}-${fecha.replace(/-/g, '')}`; 

                // NUEVO PAYLOAD CON TODAS LAS MÉTRICAS
                const payload = {
                    llave_jornada: llave_jornada,
                    tecnico: id_tecnico,
                    fecha: fecha,
                    motivo: motivoInput.value,
                    tiempo: parseFloat(tiempoInput.value),
                    comentario: comentarioInput.value
                };

                btn.disabled = true;
                spinner.classList.remove('d-none');
                btnText.innerText = "Registrando...";

                try {
                    // AQUÍ PONES TU URL
                    const urlAutomate = "https://defaultc9a8e948bf0d4f8d9e9d551ac1b45a.48.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/9bd6afe1c8a6458fb8951535152cc54a/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=7om6UfdxQcNtralinqhj9vWLVgM36hT2CNhUe9XKoNk";
                    
                    const response = await fetch(urlAutomate, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });

                    if(response.ok) {
                        Swal.fire({
                            title: "¡Guardado!",
                            text: "La auditoría ha sido documentada.",
                            icon: "success",
                            background: "var(--dark-corp)",
                            color: "#F8F9FA",
                            confirmButtonColor: "var(--teal-corp)",
                            timer: 3000,
                            timerProgressBar: true
                        }).then(() => {
                            comentarioInput.value = ""; 
                            tiempoInput.value = "";
                            motivoInput.value = "";
                        });
                    } else {
                        throw new Error("Fallo en el servidor");
                    }
                } catch (error) {
                    Swal.fire({
                        title: "Error",
                        text: "No se logró enviar. Verifica tu red.",
                        icon: "error",
                        background: "var(--dark-corp)",
                        color: "#F8F9FA",
                        confirmButtonColor: "var(--orange-corp)"
                    });
                } finally {
                    btn.disabled = false;
                    spinner.classList.add('d-none');
                    btnText.innerText = "Guardar Justificación";
                }
            });
        });
    </script>
</body>
</html>
